<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choose a time | Revvi</title>
  <style>
    :root { color-scheme: light; --ink:#17201d; --muted:#63716b; --paper:#f8f8f4; --line:#dce2dc; --brand:#126a47; --mint:#dff4e9; --warn:#fff5d6; }
    * { box-sizing: border-box; } body { margin: 0; padding: 24px 16px 48px; background: var(--paper); color: var(--ink); font: 16px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; }
    main { max-width: 860px; margin: auto; } .eyebrow { color: var(--brand); font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 8px 0; font-size: clamp(30px, 5vw, 52px); line-height: 1; letter-spacing: -.05em; } h2 { margin: 0; font-size: 22px; } p { color: var(--muted); }
    .context, .panel, .state { border: 1px solid var(--line); border-radius: 16px; background: white; padding: 20px; } .context { margin: 24px 0 16px; }
    .context-row, .date-row, .review-row { display: flex; justify-content: space-between; gap: 16px; align-items: center; } .context-row strong { display: block; font-size: 18px; }
    .change, .back { color: var(--brand); font-weight: 700; } .date-row { margin-top: 24px; align-items: end; } label { display: grid; gap: 6px; font-weight: 700; } input[type="date"] { border: 1px solid var(--line); border-radius: 9px; color: var(--ink); font: inherit; padding: 10px; }
    .slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 16px; } .slot { background: var(--mint); border: 1px solid #bfe3d0; border-radius: 12px; color: var(--brand); cursor: pointer; font: inherit; font-weight: 800; padding: 14px; text-align: left; } .slot small { color: var(--muted); display: block; font-weight: 500; margin-top: 3px; }
    .state { margin-top: 16px; } .state[data-kind="error"], .next { background: var(--warn); border-color: #ead79b; } .next { border: 1px solid #ead79b; border-radius: 12px; margin-top: 16px; padding: 14px; } .next button { background: none; border: 0; color: var(--brand); cursor: pointer; font: inherit; font-weight: 800; padding: 0; }
    .review { display: grid; gap: 12px; margin-top: 20px; } .review-row { border-bottom: 1px solid var(--line); padding-bottom: 10px; } .review-row span { color: var(--muted); } .review-row strong { text-align: right; }
    .review-actions { display: flex; gap: 12px; margin-top: 22px; } .button { background: var(--brand); border: 0; border-radius: 9px; color: white; cursor: pointer; font: inherit; font-weight: 800; padding: 12px 16px; }
    [hidden] { display: none !important; } @media (max-width: 640px) { body { padding: 16px 12px 36px; } .context-row, .date-row, .review-row { align-items: flex-start; flex-direction: column; } .slots { grid-template-columns: 1fr 1fr; } .review-row strong { text-align: left; } .review-actions { flex-direction: column; } .review-actions > * { text-align: center; width: 100%; } }
  </style>
</head>
<body>
  <main data-testid="availability-page" aria-live="polite">
    <div class="eyebrow">Revvi booking</div>
    <h1 id="page-title">Choose a time</h1>
    <p id="page-description">Live times for your selected service.</p>
    <section class="context" data-testid="booking-context" hidden>
      <div class="context-row"><div><span class="eyebrow">Booking context</span><strong id="location-name"></strong><span id="business-name"></span></div><a class="change" id="change-location" href="/locations">Change location</a></div>
    </section>
    <section class="panel" data-testid="time-selection" hidden>
      <div class="date-row"><div><span class="eyebrow" id="service-name"></span><h2 id="service-summary"></h2></div><label>Date<input data-testid="date-picker" id="date-picker" type="date" /></label></div>
      <section class="state" data-testid="loading" id="loading">Loading live times…</section>
      <section class="state" data-testid="empty-date" id="empty-date" hidden>No times are available on this date.</section>
      <div class="next" data-testid="earliest-next" id="earliest-next" hidden></div>
      <section class="slots" data-testid="slots" id="slots" hidden></section>
      <section class="state" data-testid="error" id="error" hidden></section>
    </section>
    <section class="panel" data-testid="review" id="review" hidden>
      <a class="back" id="back-to-times" href="#">← Change time</a><div class="eyebrow" style="margin-top: 20px">Final review</div><h2>Check your Booking details</h2>
      <div class="review"><div class="review-row"><span>Business</span><strong id="review-business"></strong></div><div class="review-row"><span>Location</span><strong id="review-location"></strong></div><div class="review-row"><span>Service</span><strong id="review-service"></strong></div><div class="review-row"><span>Start time</span><strong id="review-start"></strong></div><div class="review-row"><span>Duration</span><strong id="review-duration"></strong></div><div class="review-row"><span>Price</span><strong id="review-price"></strong></div></div>
      <div class="review-actions"><a class="back" id="review-back" href="#">Back to times</a><button class="button" type="button" disabled>Continue</button></div>
    </section>
  </main>
  <script>
    const apiBase = window.REVVI_CATALOGUE_API_URL || "/functions/v1/booking-availability";
    const token = window.REVVI_CUSTOMER_TOKEN;
    const elements = {
      context: document.querySelector("[data-testid='booking-context']"), business: document.querySelector("#business-name"), location: document.querySelector("#location-name"), change: document.querySelector("#change-location"),
      timeSelection: document.querySelector("[data-testid='time-selection']"), serviceName: document.querySelector("#service-name"), serviceSummary: document.querySelector("#service-summary"), date: document.querySelector("#date-picker"), loading: document.querySelector("#loading"), empty: document.querySelector("#empty-date"), next: document.querySelector("#earliest-next"), slots: document.querySelector("#slots"), error: document.querySelector("#error"), review: document.querySelector("#review"),
      reviewBusiness: document.querySelector("#review-business"), reviewLocation: document.querySelector("#review-location"), reviewService: document.querySelector("#review-service"), reviewStart: document.querySelector("#review-start"), reviewDuration: document.querySelector("#review-duration"), reviewPrice: document.querySelector("#review-price"), backToTimes: document.querySelector("#back-to-times"), reviewBack: document.querySelector("#review-back"),
    };
    function today() { return new Date().toISOString().slice(0, 10); }
    function currentParams() { return new URLSearchParams(location.search); }
    function selectedDate(params = currentParams()) { return params.get("date") || today(); }
    function updateUrl({ date, start = null }) { const next = currentParams(); next.set("date", date); if (start) next.set("start", start); else next.delete("start"); history.pushState(null, "", `${location.pathname}?${next}`); }
    function showState(name) { [elements.loading, elements.empty, elements.error, elements.slots].forEach((element) => { element.hidden = element !== elements[name]; }); }
    function formatTime(value, timezone) { return new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short", timeZone: timezone || "UTC" }).format(new Date(value)); }
    function formatPrice(value) { return value === null || value === undefined ? "Price confirmed at Booking" : String(value); }
    function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[character])); }
    function context(data) { elements.business.textContent = data.business.displayName; elements.location.textContent = data.location.displayName; elements.change.href = data.business.locationBrowserPath || "/locations"; elements.context.hidden = false; }
    function renderReview(data) {
      elements.timeSelection.hidden = true; elements.review.hidden = false; document.querySelector("#page-title").textContent = "Review your Booking"; document.querySelector("#page-description").textContent = "Confirm the details before continuing.";
      elements.reviewBusiness.textContent = data.review.business.displayName; elements.reviewLocation.textContent = data.review.location.displayName; elements.reviewService.textContent = data.review.service.name; elements.reviewStart.textContent = formatTime(data.review.startTime, data.location.timezone); elements.reviewDuration.textContent = data.review.service.durationMinutes ? `${data.review.service.durationMinutes} minutes` : "Confirmed at Booking"; elements.reviewPrice.textContent = formatPrice(data.review.service.price);
      const back = new URL(location.href); back.searchParams.delete("start"); elements.backToTimes.href = back.toString(); elements.reviewBack.href = back.toString();
    }
    function renderTimes(data) {
      elements.timeSelection.hidden = false; elements.review.hidden = true; elements.date.value = data.availability.selectedDate; elements.serviceName.textContent = data.service.name; elements.serviceSummary.textContent = `${data.service.durationMinutes ? `${data.service.durationMinutes} minutes` : "Service"} · ${formatPrice(data.service.price)}`;
      if (data.availability.state === "empty") { showState("empty"); } else { elements.slots.innerHTML = data.availability.slots.map((slot) => `<button class="slot" type="button" data-start="${escapeHtml(slot.startTime)}">${escapeHtml(formatTime(slot.startTime, data.location.timezone))}<small>${slot.durationMinutes ? `${slot.durationMinutes} minutes` : "Live time"} · ${escapeHtml(formatPrice(slot.price))}</small></button>`).join(""); elements.slots.querySelectorAll("[data-start]").forEach((button) => button.addEventListener("click", () => { updateUrl({ date: data.availability.selectedDate, start: button.dataset.start }); load(); })); showState("slots"); }
      if (data.availability.earliestNextAvailability) { const next = data.availability.earliestNextAvailability; elements.next.innerHTML = `Earliest next availability: <strong>${escapeHtml(next.date)}</strong> <button type="button" data-next-date="${escapeHtml(next.date)}">View times</button>`; elements.next.hidden = false; elements.next.querySelector("button").addEventListener("click", () => { updateUrl({ date: next.date }); load(); }); } else { elements.next.hidden = true; }
      if (window.REVVI_TEST_RESPONSIVE) requestAnimationFrame(() => { document.body.dataset.responsive = document.documentElement.scrollWidth <= window.innerWidth ? "true" : "false"; });
    }
    async function load() {
      const params = currentParams();
      elements.error.hidden = true; elements.loading.hidden = false;
      if (!token) { elements.error.textContent = "Sign in through Revvi to choose a time."; showState("error"); return; }
      if (!params.get("business") || !params.get("location") || !params.get("service")) { elements.error.textContent = "Choose a Business, Location, and service before selecting a time."; showState("error"); return; }
      const query = new URLSearchParams({ business: params.get("business"), location: params.get("location"), service: params.get("service"), date: selectedDate() }); if (params.get("start")) query.set("start", params.get("start"));
      try { const response = await fetch(`${apiBase}?${query}`, { headers: { Authorization: `Bearer ${token}` } }); const data = await response.json(); if (!response.ok) throw new Error(data.error || "Live availability could not be loaded."); context(data); if (data.review) renderReview(data); else renderTimes(data); } catch (error) { elements.timeSelection.hidden = false; elements.review.hidden = true; elements.error.textContent = error.message; showState("error"); }
    }
    elements.date.addEventListener("change", () => { updateUrl({ date: elements.date.value || selectedDate() }); load(); });
    addEventListener("popstate", load);
    load();
  </script>
</body>
</html>
