<section

  data-upcoming-endpoint="SUPABASE_FUNCTIONS_URL/upcoming-bookings"
  data-cancellation-endpoint="SUPABASE_FUNCTIONS_URL/cancel-booking"
>
  <h2>Your upcoming Classes</h2>
  <p data-history-loading hidden>Loading your upcoming Bookingsâ€¦</p>
  <p data-history-error hidden></p>

  <template data-history-booking-template>

</section>
